<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Takiwaltek Games</title>
    <style>
        :root {
            --bg: #03060a;
            --panel: rgba(6, 12, 16, 0.88);
            --g: #00ff9c;
            --c: #00f0ff;
            --m: #ff2bd6;
            --y: #fcee0a;
            --r: #ff2a55;
            --dim: #5f7f74;
            --text: #c9ffe9;
            --mono: "Cascadia Mono", Consolas, "Lucida Console", monospace;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: var(--mono);
            font-size: 14px;
            min-height: 100vh;
        }

        body {
            background: url('takiwaltek-logo.webp') fixed center/cover no-repeat,
                        radial-gradient(ellipse at 50% 20%, rgba(0, 240, 255, 0.11), transparent 48%),
                        radial-gradient(ellipse at 85% 80%, rgba(255, 43, 214, 0.08), transparent 42%),
                        radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.75)),
                        var(--bg);
            background-size: cover, 140% 140%, 140% 140%, cover, 100% 100%;
            background-attachment: fixed, scroll, scroll, fixed, scroll;
            animation: ambientDrift 16s ease-in-out infinite alternate;
        }

        @keyframes ambientDrift {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        #scan {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.18) 0, rgba(0, 0, 0, 0.18) 1px, transparent 1px, transparent 3px);
            mix-blend-mode: multiply;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1280px;
            margin: 0 auto;
            padding: 20px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 15px;
            animation: slideDown 0.8s ease-out;
            padding: 12px 20px;
            border-bottom: 2px solid rgba(0, 255, 156, 0.5);
            background: linear-gradient(135deg, rgba(0, 255, 156, 0.08), rgba(0, 240, 255, 0.05));
            background-color: rgba(6, 12, 16, 0.6);
            backdrop-filter: blur(8px);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 3px;
            color: var(--g);
            text-shadow: 0 0 20px rgba(0, 255, 156, 0.8), 0 0 40px rgba(0, 255, 156, 0.4);
            margin: 0 0 3px;
        }

        .tagline {
            color: var(--dim);
            font-size: 0.65rem;
            letter-spacing: 1px;
            margin: 0;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
            padding: 0 20px;
            margin-bottom: 30px;
        }

        .game-card {
            background:
                linear-gradient(135deg, rgba(0, 255, 156, 0.055), transparent 45%),
                var(--panel);
            border: 1px solid rgba(0, 255, 156, 0.48);
            border-radius: 0;
            clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
            padding: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.48), inset 0 1px rgba(255, 255, 255, 0.08), 0 0 18px rgba(0, 255, 156, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            animation: cardSlideIn 0.6s ease-out;
            animation-fill-mode: both;
        }

        .game-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            display: block;
        }

        .game-title {
            font-size: 1.3rem;
            font-weight: bold;
            color: var(--c);
            margin: 10px 0 8px;
            letter-spacing: 1px;
        }

        .game-description {
            color: var(--dim);
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .game-stats {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 0.75rem;
            color: var(--dim);
        }

        section {
            margin-top: 40px;
            padding: 25px 20px;
            border-top: 2px solid rgba(0, 255, 156, 0.3);
            animation: slideUp 0.8s ease-out forwards;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--g);
            letter-spacing: 2px;
            margin: 0 0 20px;
            text-shadow: 0 0 15px rgba(0, 255, 156, 0.5);
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .content-card {
            background:
                linear-gradient(135deg, rgba(0, 240, 255, 0.055), transparent 45%),
                var(--panel);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 0;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            padding: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 1px rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .content-card h3 {
            color: var(--c);
            margin: 0 0 8px;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .content-card p {
            color: var(--dim);
            margin: 0 0 12px;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .play-btn {
            display: inline-block;
            background: linear-gradient(135deg, rgba(0, 255, 156, 0.15), rgba(0, 240, 255, 0.1));
            border: 2px solid var(--g);
            color: var(--g);
            padding: 12px 28px;
            font-family: var(--mono);
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        .play-btn:hover {
            background: linear-gradient(135deg, rgba(0, 255, 156, 0.3), rgba(0, 240, 255, 0.2));
            box-shadow: 0 0 20px rgba(0, 255, 156, 0.6);
            transform: translateX(4px);
        }

        .content-card a,
        .content-card button {
            display: inline-block;
            background: linear-gradient(135deg, rgba(0, 255, 156, 0.15), rgba(0, 240, 255, 0.1));
            border: 2px solid var(--g);
            color: var(--g) !important;
            padding: 10px 20px;
            font-family: var(--mono);
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
            margin-top: 5px;
        }

        .content-card a:hover,
        .content-card button:hover {
            background: linear-gradient(135deg, rgba(0, 255, 156, 0.3), rgba(0, 240, 255, 0.2));
            box-shadow: 0 0 20px rgba(0, 255, 156, 0.6);
            transform: translateX(3px);
            color: var(--g) !important;
        }

        .simple-btn {
            display: inline-block;
            background: linear-gradient(135deg, rgba(0, 255, 156, 0.08), rgba(0, 240, 255, 0.05));
            border: 2px solid var(--g);
            color: var(--g);
            padding: 16px 40px;
            font-family: var(--mono);
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            box-shadow: 0 0 15px rgba(0, 255, 156, 0.3);
            background-color: rgba(6, 12, 16, 0.6);
            backdrop-filter: blur(8px);
        }

        .simple-btn:hover {
            background: linear-gradient(135deg, rgba(0, 255, 156, 0.15), rgba(0, 240, 255, 0.1));
            background-color: rgba(6, 12, 16, 0.75);
            box-shadow: 0 0 30px rgba(0, 255, 156, 0.8);
            transform: translateY(-5px) scale(1.05);
        }

        .buttons-container {
            text-align: center;
            margin-top: 30px;
            padding: 35px 20px;
            border-top: 2px solid rgba(0, 255, 156, 0.5);
            border-bottom: 2px solid rgba(0, 255, 156, 0.5);
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.55));
            backdrop-filter: blur(12px);
        }

        .buttons-container > div {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            animation: buttonsIn 0.8s ease-out 0.3s both;
        }

        @keyframes buttonsIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .mini-game-card {
            background: linear-gradient(135deg, rgba(0, 255, 156, 0.055), transparent 45%), var(--panel);
            border: 2px solid rgba(0, 255, 156, 0.6);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            padding: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 1px rgba(255, 255, 255, 0.05), 0 0 15px rgba(0, 255, 156, 0.2);
            transition: all 0.3s ease;
            text-align: center;
            animation: cardSlideIn 0.6s ease-out 0.4s both;
        }

        .mini-game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 25px rgba(0, 255, 156, 0.4);
            border-color: rgba(0, 255, 156, 0.9);
        }

        .mini-game-card h3 {
            color: var(--g);
            margin: 0 0 5px;
            font-size: 1.2rem;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 255, 156, 0.6);
        }

        .mini-game-card p {
            color: var(--dim);
            margin: 0 0 12px;
            font-size: 0.85rem;
        }

        @media (max-width: 768px) {
            .buttons-container > div {
                grid-template-columns: 1fr !important;
            }
            .mini-game-card {
                margin-top: 20px;
            }
        }

        .steam-section {
            margin-top: 30px;
            margin-bottom: 30px;
            padding: 0;
            border-top: 2px solid rgba(0, 255, 156, 0.5);
            border-bottom: 2px solid rgba(0, 255, 156, 0.5);
            background: linear-gradient(180deg, rgba(0, 255, 156, 0.05), rgba(0, 0, 0, 0.15));
            animation: slideUp 0.8s ease-out forwards;
        }

        .steam-title-container {
            padding: 15px 20px;
            border-bottom: 2px solid rgba(0, 255, 156, 0.5);
            background: linear-gradient(135deg, rgba(0, 255, 156, 0.12), rgba(0, 240, 255, 0.1));
            backdrop-filter: blur(12px);
            background-color: rgba(6, 12, 16, 0.75);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%);
            box-shadow: inset 0 1px rgba(255, 255, 255, 0.1), 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .steam-title {
            font-size: 1.5rem;
            color: var(--g);
            letter-spacing: 3px;
            margin: 0;
            text-shadow: 0 0 20px rgba(0, 255, 156, 0.8), 0 0 40px rgba(0, 255, 156, 0.4);
            text-align: center;
        }

        .steam-grid-container {
            padding: 15px 20px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .steam-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            padding: 0 20px;
        }

        .steam-card {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.055), transparent 45%), var(--panel);
            border: 1px solid rgba(0, 240, 255, 0.4);
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
            padding: 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4), inset 0 1px rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .steam-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            object-position: center;
            border-bottom: 1px solid rgba(0, 240, 255, 0.3);
        }

        .steam-card-content {
            padding: 6px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .steam-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 240, 255, 0.2);
            border-color: rgba(0, 240, 255, 0.7);
        }

        .steam-card h3 {
            color: var(--c);
            margin: 0 0 2px;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            word-break: break-word;
        }

        .steam-card p {
            color: var(--dim);
            margin: 0 0 6px;
            font-size: 0.65rem;
            line-height: 1.2;
            flex-grow: 1;
        }

        .steam-card a {
            display: inline-block;
            background: linear-gradient(135deg, rgba(0, 255, 156, 0.15), rgba(0, 240, 255, 0.1));
            border: 1px solid var(--g);
            color: var(--g);
            padding: 4px 8px;
            font-size: 0.65rem;
            font-weight: bold;
            letter-spacing: 0.5px;
            text-decoration: none;
            transition: all 0.2s ease;
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
        }

        .steam-card a:hover {
            background: linear-gradient(135deg, rgba(0, 255, 156, 0.3), rgba(0, 240, 255, 0.2));
            box-shadow: 0 0 15px rgba(0, 255, 156, 0.6);
        }

        .loading {
            text-align: center;
            color: var(--dim);
            padding: 20px;
            font-size: 0.9rem;
        }

        .video-embed {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            margin-bottom: 15px;
            overflow: hidden;
            border: 1px solid rgba(0, 255, 156, 0.3);
            clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
        }

        .video-embed iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: rgba(0, 240, 255, 0.05);
            border-left: 3px solid var(--c);
            transition: all 0.2s;
        }

        .link-item:hover {
            background: rgba(0, 240, 255, 0.15);
            transform: translateX(5px);
        }

        .link-item a {
            color: var(--c);
            text-decoration: none;
            flex: 1;
            font-size: 0.9rem;
        }

        .link-item a:hover {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 255, 156, 0.2);
            color: var(--dim);
            font-size: 0.8rem;
        }

        .footer-link {
            color: var(--c);
            text-decoration: none;
            transition: all 0.2s;
        }

        .footer-link:hover {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 1.8rem;
            }
            .games-grid,
            .content-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .game-card,
            .content-card {
                padding: 15px;
            }
            .section-title {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div id="scan"></div>

    <div class="container">
        <header>
            <h1 class="logo">TAKIWALTEK</h1>
            <p class="tagline">GAMES COLLECTION · ROOT@TAKIWALTEK.FR/GAMES</p>
        </header>

        <!-- 4 BOUTONS + PETIT JEU -->
        <div class="buttons-container">
            <div style="display: grid; grid-template-columns: 1fr 250px; gap: 30px; align-items: center; max-width: 1200px; margin: 0 auto;">
                <!-- Boutons -->
                <div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; animation: buttonsIn 0.8s ease-out 0.3s both;">
                    <a href="https://www.youtube.com/@takiwaltek" target="_blank" class="simple-btn">📹 VIDÉOS</a>
                    <a href="https://soundcloud.com/takiwalte" target="_blank" class="simple-btn">🎵 SON</a>
                    <a href="https://www.caracterespeciaux.com/" target="_blank" class="simple-btn">🔤 CARACTÈRES</a>
                    <a href="https://www.dafont.com/fr/" target="_blank" class="simple-btn">🔤 POLICES</a>
                </div>
                <!-- Mini Jeu -->
                <div class="mini-game-card">
                    <h3>💻 NEON</h3>
                    <p>Idle Game</p>
                    <a href="./1/index.html" class="play-btn" style="padding: 10px 20px; font-size: 0.85rem;">JOUER ▶</a>
                </div>
            </div>
        </div>

        <!-- STEAM NOUVEAUTÉS -->
        <div class="steam-section">
            <div class="steam-title-container">
                <h2 class="steam-title">🎮 NOUVEAUTÉS STEAM</h2>
            </div>
            <div class="steam-grid-container">
                <div class="steam-grid" id="steam-grid">
                    <div class="loading">Chargement des jeux Steam...</div>
                </div>
            </div>
        </div>

        <footer>
            <p>© 2025 Takiwaltek Games · Tous droits réservés</p>
            <p>Développé avec passion · <a href="https://github.com/Takiwaltek/Games" class="footer-link">GitHub</a></p>
        </footer>
    </div>

    <script>
        // Jeux Steam NOUVEAUTÉS 2025-2026
        const popularGames = [
            { name: 'Metaphor: ReFantazio', id: 2677930, released: '11 Octobre 2024' },
            { name: 'Indiana Jones and the Great Circle', id: 2757590, released: '9 Décembre 2024' },
            { name: 'S.T.A.L.K.E.R. 2: Heart of Chornobyl', id: 2645590, released: '20 Novembre 2024' },
            { name: 'Dragon Age: The Veilguard', id: 1222690, released: '31 Octobre 2024' },
            { name: 'Persona 3 Reload', id: 2372440, released: '21 Février 2024' },
            { name: 'Final Fantasy VII Rebirth', id: 1462040, released: '29 Février 2024' },
            { name: 'Tekken 8', id: 1899140, released: '26 Janvier 2024' },
            { name: 'Helldivers 2', id: 553850, released: '8 Février 2024' },
            { name: 'Like a Dragon: Infinite Wealth', id: 2190560, released: '16 Janvier 2024' },
            { name: 'Palworld', id: 1623730, released: '19 Janvier 2024' },
            { name: 'Final Fantasy XVI', id: 2246618, released: '29 Juin 2023' },
            { name: 'Baldur\'s Gate 3', id: 1238140, released: '3 Août 2023' }
        ];

        function loadSteamGames() {
            try {
                const grid = document.getElementById('steam-grid');
                grid.innerHTML = '';
                
                // Afficher les jeux populaires avec images
                popularGames.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'steam-card';
                    const imageUrl = `https://cdn.cloudflare.steamstatic.com/steam/apps/${game.id}/header.jpg`;
                    card.innerHTML = `
                        <img src="${imageUrl}" alt="${game.name}" loading="lazy">
                        <div class="steam-card-content">
                            <h3>${game.name}</h3>
                            <p>${game.released}</p>
                            <a href="https://store.steampowered.com/app/${game.id}" target="_blank">Voir ▶</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Erreur:', error);
                const grid = document.getElementById('steam-grid');
                grid.innerHTML = '<div class="loading">Erreur lors du chargement.</div>';
            }
        }
        
        // Charger les jeux au chargement
        document.addEventListener('DOMContentLoaded', loadSteamGames);
    </script>
</body>
</html>
