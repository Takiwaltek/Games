<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atelier de Taki</title>
    <style>
        @font-face {
            font-family: "Astral Delight";
            src: url('fonts/AstralDelight-Black.ttf') format('truetype');
            font-weight: 900;
            font-display: swap;
        }

        @font-face {
            font-family: "Broadway";
            src: url('fonts/Broadway-Regular.ttf') format('truetype');
            font-weight: 400;
            font-display: swap;
        }

        :root {
            --bg: #0a0c10;
            --panel: #121620;
            --panel-2: #181d29;
            --line: #252c3b;
            --text: #e6edf3;
            --muted: #8b96a8;
            --accent: #00e08a;
            --accent-2: #38bdf8;
            --radius: 16px;
            --font: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 15px;
        }

        body {
            position: relative;
            overflow-x: hidden;
        }

        .bg-photo {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(10, 12, 16, 0.55), rgba(10, 12, 16, 0.92)),
                url('takiwaltek-logo.webp') center / cover no-repeat;
            opacity: 0.6;
        }

        .bg-orbs {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-orbs span {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.28;
            animation: drift 20s ease-in-out infinite alternate;
        }

        .bg-orbs span:nth-child(1) {
            width: 480px;
            height: 480px;
            background: var(--accent);
            top: -140px;
            left: -120px;
        }

        .bg-orbs span:nth-child(2) {
            width: 420px;
            height: 420px;
            background: var(--accent-2);
            right: -140px;
            top: 30%;
            animation-duration: 24s;
        }

        .bg-orbs span:nth-child(3) {
            width: 380px;
            height: 380px;
            background: #a78bfa;
            bottom: -160px;
            left: 35%;
            animation-duration: 28s;
        }

        @keyframes drift {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(70px, 50px) scale(1.12); }
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 1180px;
            margin: 0 auto;
            padding: 56px 24px 64px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: none; }
        }

        .hero {
            padding: 12px 0 8px;
            animation: fadeUp 0.7s ease-out backwards;
        }

        .eyebrow {
            display: inline-block;
            margin: 0 0 18px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(0, 224, 138, 0.1);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .logo {
            margin: 0;
            font-family: "Astral Delight", var(--font);
            font-size: clamp(2.6rem, 6.5vw, 4.6rem);
            font-weight: 900;
            line-height: 1.05;
            letter-spacing: 0.01em;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--text), var(--accent), var(--accent-2), var(--text));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 7s linear infinite;
        }

        @keyframes shine {
            to { background-position: 300% 0; }
        }

        .hero-bar {
            width: 140px;
            height: 4px;
            margin-top: 26px;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transform-origin: left;
            animation: grow 0.9s ease-out 0.2s backwards;
        }

        @keyframes grow {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        .hub {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 24px;
            align-items: start;
            margin-top: 40px;
        }

        .tiles {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
        }

        .tiles > * {
            animation: fadeUp 0.6s ease-out backwards;
        }

        .tiles > *:nth-child(1) { animation-delay: 0.1s; }
        .tiles > *:nth-child(2) { animation-delay: 0.16s; }
        .tiles > *:nth-child(3) { animation-delay: 0.22s; }
        .tiles > *:nth-child(4) { animation-delay: 0.28s; }
        .tiles > *:nth-child(5) { animation-delay: 0.34s; }

        .tile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 20px 22px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--text);
            font-family: "Broadway", var(--font);
            font-size: 1.25rem;
            font-weight: 400;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
        }

        .tile::after {
            content: "→";
            color: var(--muted);
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .tile:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            background: var(--panel-2);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.35);
        }

        .tile:hover::after {
            transform: translateX(4px);
            color: var(--accent);
        }

        .sat-menu {
            position: relative;
        }

        .menu-title {
            background: linear-gradient(90deg, var(--accent), var(--accent-2), #a78bfa, var(--accent));
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            animation: shine 6s linear infinite;
        }

        .sat-menu > summary {
            list-style: none;
        }

        .sat-menu > summary::-webkit-details-marker {
            display: none;
        }

        .sat-menu > summary::after {
            content: "▾";
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .sat-menu[open] > summary {
            border-color: var(--accent);
        }

        .sat-menu[open] > summary::after {
            transform: rotate(180deg);
            color: var(--accent);
        }

        .sat-menu-list {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            right: 0;
            z-index: 30;
            display: grid;
            gap: 4px;
            padding: 8px;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 22px 44px rgba(0, 0, 0, 0.5);
            transform-origin: top;
        }

        .sat-menu[open] .sat-menu-list {
            animation: menuIn 0.22s ease-out;
        }

        @keyframes menuIn {
            from { opacity: 0; transform: translateY(-8px) scale(0.98); }
            to { opacity: 1; transform: none; }
        }

        .sat-menu-list a {
            display: block;
            padding: 12px 14px;
            border-radius: 10px;
            color: var(--text);
            font-family: "Broadway", var(--font);
            font-size: 1.15rem;
            font-weight: 400;
            text-decoration: none;
            transition: background 0.2s ease, color 0.2s ease, padding-left 0.2s ease;
        }

        .sat-menu-list a:hover {
            padding-left: 20px;
            background: rgba(0, 224, 138, 0.12);
            color: var(--accent);
        }

        .arcade {
            position: relative;
            padding: 24px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            animation: fadeUp 0.7s ease-out 0.25s backwards;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .arcade::before {
            content: "";
            position: absolute;
            inset: -60%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(56, 189, 248, 0.22) 60deg, transparent 120deg);
            animation: spin 9s linear infinite;
            pointer-events: none;
        }

        .arcade:hover {
            transform: translateY(-4px);
            border-color: var(--accent-2);
        }

        .arcade > * {
            position: relative;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .arcade h3 {
            margin: 0 0 4px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .arcade p {
            margin: 0 0 18px;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 18px;
            border-radius: 10px;
            background: var(--accent);
            color: #04120b;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(0, 224, 138, 0.3);
        }

        .steam {
            margin-top: 44px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            animation: fadeUp 0.7s ease-out 0.35s backwards;
        }

        .steam-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 22px;
            border-bottom: 1px solid var(--line);
        }

        .steam-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 700;
        }

        .steam-updated {
            color: var(--muted);
            font-size: 0.8rem;
        }

        .steam-list {
            display: flex;
            gap: 14px;
            overflow-x: auto;
            padding: 18px 22px 22px;
            scroll-snap-type: x mandatory;
            scrollbar-width: thin;
        }

        .steam-item {
            flex: 0 0 200px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
            scroll-snap-align: start;
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: inherit;
            text-decoration: none;
            transition: transform 0.25s ease, border-color 0.25s ease;
        }

        .steam-item:hover {
            transform: translateY(-4px);
            border-color: var(--accent-2);
        }

        .steam-item img {
            display: block;
            width: 100%;
            height: 94px;
            object-fit: cover;
        }

        .steam-item-name {
            padding: 0 12px;
            overflow: hidden;
            font-size: 0.9rem;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .steam-item-price {
            padding: 0 12px 12px;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .steam-discount {
            display: inline-block;
            margin-right: 8px;
            padding: 2px 6px;
            border-radius: 6px;
            background: var(--accent);
            color: #04120b;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .loading {
            padding: 8px 0;
            color: var(--muted);
        }

        .site-footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.85rem;
            text-align: center;
            animation: fadeUp 0.7s ease-out 0.45s backwards;
        }

        .site-footer p {
            margin: 4px 0;
        }

        .footer-link {
            color: var(--accent-2);
            text-decoration: none;
        }

        .footer-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 860px) {
            .hub {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            .page {
                padding: 36px 16px 48px;
            }
            .tiles {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="bg-photo" aria-hidden="true"></div>
    <div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

    <main class="page">
        <header class="hero">
            <span class="eyebrow">Games collection</span>
            <h1 class="logo">Atelier de Taki</h1>
            <div class="hero-bar" aria-hidden="true"></div>
        </header>

        <section class="hub">
            <nav class="tiles" aria-label="Liens">
                <a class="tile" href="https://www.youtube.com/@takiwaltek" target="_blank" rel="noopener">Vidéos</a>
                <a class="tile" href="https://soundcloud.com/takiwalte" target="_blank" rel="noopener">Son</a>
                <details class="sat-menu">
                    <summary class="tile"><span class="menu-title">Ressources</span></summary>
                    <div class="sat-menu-list">
                        <a href="https://www.caracterespeciaux.com/" target="_blank" rel="noopener">Caractères</a>
                        <a href="https://www.dafont.com/fr/" target="_blank" rel="noopener">Polices</a>
                    </div>
                </details>
                <details class="sat-menu">
                    <summary class="tile"><span class="menu-title">Satisfactory</span></summary>
                    <div class="sat-menu-list">
                        <a href="./calculateur/index.html">Calculateur</a>
                        <a href="./carte/index.html">Carte de la base</a>
                        <a href="https://satisfactory-calculator.com/fr/interactive-map#3;49935;130005|gameLayer|limestonePure;ironPure;copperPure;cateriumPure;coalPure;oilPure;hardDrives" target="_blank" rel="noopener">Carte officielle</a>
                    </div>
                </details>
            </nav>

            <aside class="arcade">
                <h3>NEON</h3>
                <p>Idle game</p>
                <a href="./1/index.html" class="btn-primary">Jouer →</a>
            </aside>
        </section>

        <section class="steam" aria-labelledby="steam-title">
            <div class="steam-head">
                <h2 class="steam-title" id="steam-title">Nouveautés Steam</h2>
                <span class="steam-updated" id="steam-updated"></span>
            </div>
            <div class="steam-list" id="steam-grid">
                <div class="loading">Chargement des nouveautés...</div>
            </div>
        </section>

        <footer class="site-footer">
            <p>© 2025 Atelier de Taki · Tous droits réservés</p>
            <p>Développé avec passion · <a href="https://github.com/Takiwaltek/Games" class="footer-link">GitHub</a></p>
        </footer>
    </main>

    <script>
        // Nouveautés Steam : fichier généré par scripts/fetch-steam-news.mjs au déploiement
        function renderSteamItem(item) {
            const link = document.createElement('a');
            link.className = 'steam-item';
            link.href = item.url;
            link.target = '_blank';
            link.rel = 'noopener';

            const img = document.createElement('img');
            img.src = item.image;
            img.alt = item.name;
            img.loading = 'lazy';

            const name = document.createElement('span');
            name.className = 'steam-item-name';
            name.textContent = item.name;
            name.title = item.name;

            const price = document.createElement('span');
            price.className = 'steam-item-price';
            if (item.discount > 0) {
                const discount = document.createElement('span');
                discount.className = 'steam-discount';
                discount.textContent = `-${item.discount}%`;
                price.append(discount);
            }
            price.append(item.price);

            link.append(img, name, price);
            return link;
        }

        async function loadSteamNews() {
            const list = document.getElementById('steam-grid');
            const updated = document.getElementById('steam-updated');
            try {
                const response = await fetch('./steam-new.json', { cache: 'no-cache' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const feed = await response.json();

                list.innerHTML = '';
                if (!feed.items?.length) {
                    list.innerHTML = '<div class="loading">Aucune nouveauté disponible pour le moment.</div>';
                    return;
                }
                feed.items.forEach(item => list.appendChild(renderSteamItem(item)));
                if (feed.updated) {
                    updated.textContent = `Mis à jour le ${new Date(feed.updated).toLocaleDateString('fr-FR')}`;
                }
            } catch (error) {
                console.error('Nouveautés Steam indisponibles:', error);
                list.innerHTML = '<div class="loading">Nouveautés Steam indisponibles.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadSteamNews);
    </script>
</body>
</html>
