<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chasse Pixels · Atelier de Takiwaltek</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background:
                radial-gradient(ellipse at 50% 0%, #2e1065 0%, transparent 55%),
                radial-gradient(ellipse at 50% 100%, #0c4a6e 0%, transparent 60%),
                #05020f;
            color: #e2e8f0;
            font-family: "Press Start 2P", system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        header {
            width: min(94vw, 760px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px 0 10px;
        }
        header a {
            color: #67e8f9;
            text-decoration: none;
            font-size: 0.6rem;
            text-shadow: 0 0 6px #22d3ee, 0 0 14px #0891b2;
        }
        h1 {
            margin: 0;
            font-size: 1rem;
            color: #fdf4ff;
            text-shadow: 0 0 4px #f0abfc, 0 0 12px #d946ef, 0 0 22px #a21caf;
        }
        .hud {
            width: min(94vw, 760px);
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            margin-bottom: 10px;
        }
        #score { color: #fde047; text-shadow: 0 0 6px #facc15; }
        #lives { color: #fb7185; text-shadow: 0 0 6px #f43f5e; }
        #level { color: #67e8f9; text-shadow: 0 0 6px #22d3ee; }
        .stage { position: relative; width: min(94vw, 760px); }
        .stage::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 10px;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 0,
                rgba(0, 0, 0, 0) 2px,
                rgba(0, 0, 0, 0.22) 3px,
                rgba(0, 0, 0, 0) 4px
            );
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #03010a;
            border: 2px solid #22d3ee;
            border-radius: 10px;
            box-shadow: 0 0 6px #22d3ee, 0 0 26px rgba(217, 70, 239, 0.45), inset 0 0 30px rgba(34, 211, 238, 0.12);
            image-rendering: pixelated;
            touch-action: none;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            padding: 16px;
            text-align: center;
            background: rgba(3, 1, 10, 0.85);
            border-radius: 10px;
        }
        .overlay[hidden] { display: none; }
        .overlay p {
            margin: 0;
            font-size: 0.6rem;
            line-height: 2;
            color: #e0f2fe;
            text-shadow: 0 0 6px #38bdf8;
        }
        button {
            font: inherit;
            font-size: 0.7rem;
            color: #fdf4ff;
            background: rgba(217, 70, 239, 0.12);
            border: 2px solid #e879f9;
            border-radius: 4px;
            padding: 14px 20px;
            cursor: pointer;
            text-shadow: 0 0 6px #e879f9;
            box-shadow: 0 0 10px rgba(232, 121, 249, 0.6), inset 0 0 10px rgba(232, 121, 249, 0.25);
        }
        button:hover { background: rgba(217, 70, 239, 0.3); }
        button:active { transform: translateY(2px); }
        .pad {
            margin-top: 14px;
            display: grid;
            grid-template-columns: repeat(3, 64px);
            grid-template-rows: repeat(2, 56px);
            gap: 8px;
        }
        .pad button {
            padding: 0;
            font-size: 1.2rem;
            background: rgba(34, 211, 238, 0.1);
            border-color: #22d3ee;
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.5), inset 0 0 8px rgba(34, 211, 238, 0.25);
            user-select: none;
        }
        .pad .up { grid-column: 2; grid-row: 1; }
        .pad .left { grid-column: 1; grid-row: 2; }
        .pad .down { grid-column: 2; grid-row: 2; }
        .pad .right { grid-column: 3; grid-row: 2; }
        @media (hover: hover) and (pointer: fine) {
            .pad { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <a href="../../index.html">← Accueil</a>
        <h1>Chasse Pixels</h1>
    </header>

    <div class="hud">
        <span id="score">Score : 0</span>
        <span id="lives">♥♥♥</span>
        <span id="level">Niveau 1</span>
    </div>

    <div class="stage">
        <canvas id="game" width="760" height="600" aria-label="Jeu Chasse Pixels"></canvas>
        <div class="overlay" id="overlay">
            <p id="msg">Mange tous les points sans te faire attraper.<br>Flèches ou WASD pour bouger.</p>
            <button id="start" type="button">Commencer</button>
        </div>
    </div>

    <div class="pad" aria-hidden="true">
        <button class="up" data-dx="0" data-dy="-1" type="button">▲</button>
        <button class="left" data-dx="-1" data-dy="0" type="button">◀</button>
        <button class="down" data-dx="0" data-dy="1" type="button">▼</button>
        <button class="right" data-dx="1" data-dy="0" type="button">▶</button>
    </div>

    <script>
    (() => {
        const T = 40;
        const TOP = [
            ".......#.#.......",
            ".#####.#.#.#####.",
            "...#.........#...",
            "#.#.###.#.###.#.#",
            "....#.......#....",
            "##.##.#####.##.##"
        ];
        const LEVELS = [
            {
                rows: [
                    "#".repeat(19),
                    ...TOP.map(r => "#" + r + "#"),
                    ".".repeat(19),
                    ...TOP.slice().reverse().map(r => "#" + r + "#"),
                    "#".repeat(19)
                ],
                power: [[1, 1], [17, 1], [1, 13], [17, 13]],
                start: [9, 7],
                look: { wall: "stone", floor: "tiles" },
                cages: [
                    { cells: [[9, 1], [9, 2]], door: [9, 3] },
                    { cells: [[9, 12], [9, 13]], door: [9, 11] }
                ],
                ghosts: [
                    { cage: 0, slot: 0, delay: 0 },
                    { cage: 0, slot: 1, delay: 0 },
                    { cage: 1, slot: 0, delay: 20000 }
                ]
            },
            {
                rows: [
                    "#########################",
                    "#.....#...........#.....#",
                    "#.##.#...#.....#...#.##.#",
                    "#...#...#.......#...#...#",
                    "##.##.###.......###.##.##",
                    "#.........#...#.........#",
                    "#.#.#.#.#.......#.#.#.#.#",
                    "#.......................#",
                    "##.##.#.#.## ##.#.#.##.##",
                    "..........#   #..........",
                    "##.##.#.#.#   #.#.#.##.##",
                    "#..........###..........#",
                    "#.#.#.#.#.......#.#.#.#.#",
                    "#.........#...#.........#",
                    "##.##.###.......###.##.##",
                    "#...#...#.......#...#...#",
                    "#.##.#...#.....#...#.##.#",
                    "#.....#...........#.....#",
                    "#########################"
                ],
                power: [[1, 1], [23, 1], [1, 17], [23, 17]],
                start: [12, 15],
                look: { wall: "brick", floor: "concrete" },
                cages: [
                    { cells: [[11, 9], [12, 9], [13, 9], [11, 10], [12, 10], [13, 10]], door: [12, 8] }
                ],
                ghosts: [
                    { cage: 0, slot: 0, delay: 0 },
                    { cage: 0, slot: 1, delay: 0 },
                    { cage: 0, slot: 2, delay: 20000 },
                    { cage: 0, slot: 3, delay: 40000 }
                ]
            }
        ];
        let W, H, ROWS, POWER, PLAYER_START, CAGES, GHOST_HOME, LOOK;
        const GHOST_COLORS = ["#ff2bd6", "#ff9f1c", "#39ff14", "#ef4444"];
        const PANIC_DIST = 2.5;
        const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        const KEYS = {
            ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
            ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
            ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
            ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
        };

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const livesEl = document.getElementById("lives");
        const levelEl = document.getElementById("level");
        const overlay = document.getElementById("overlay");
        const msgEl = document.getElementById("msg");
        const startBtn = document.getElementById("start");

        let grid, smallDotsLeft, px, py, pdx, pdy, wdx, wdy, ghosts, backdrop;
        let powerRespawns = [];
        let score = 0, lives = 3, level = 1;
        let powerUntil = 0, freezeUntil = 0;
        let lastFrame = 0, chompAt = -1e9;
        let state = "idle";

        let audioCtx = null;
        let muted = false;
        let chompToggle = false;

        function unlockAudio() {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return;
            if (!audioCtx) audioCtx = new AC();
            if (audioCtx.state === "suspended") audioCtx.resume();
        }

        function playTone(freq, dur, type, vol, slideTo, delay) {
            if (muted || !audioCtx) return;
            const t0 = audioCtx.currentTime + (delay || 0);
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
            gain.gain.setValueAtTime(vol, t0);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t0);
            osc.stop(t0 + dur);
        }

        const sfx = {
            chomp() {
                chompToggle = !chompToggle;
                playTone(chompToggle ? 260 : 200, 0.09, "triangle", 0.12);
            },
            power() { playTone(180, 0.35, "sawtooth", 0.07, 720); },
            eatGhost() { playTone(400, 0.25, "square", 0.08, 1600); },
            death() { playTone(600, 0.9, "square", 0.09, 80); },
            levelUp() { [523, 659, 784, 1046].forEach((f, i) => playTone(f, 0.15, "square", 0.07, null, i * 0.12)); },
            gameOver() { [392, 330, 262, 196].forEach((f, i) => playTone(f, 0.3, "triangle", 0.1, null, i * 0.25)); },
        };

        const CHIP_BARS = [
            [[440, 2], [523, 2], [659, 4]],
            [[587, 2], [523, 2], [440, 2], [349, 2]],
            [[392, 2], [523, 2], [659, 2], [784, 2]],
            [[587, 4], [494, 2], [392, 2]],
            [[659, 2], [880, 2], [784, 2], [659, 2]],
            [[698, 4], [659, 2], [523, 2]],
            [[587, 2], [659, 2], [784, 2], [659, 2]],
            [[587, 2], [523, 2], [494, 4]],
        ];
        const CHIP_BASS = [110, 87.3, 130.8, 98, 110, 87.3, 98, 82.4];
        const chipEvents = [];
        CHIP_BARS.forEach((bar, b) => {
            let s = b * 8;
            for (const [f, n] of bar) {
                chipEvents[s] = { f, n };
                s += n;
            }
        });

        const CHIP_STEP = 0.13;
        const LEAD2_STEP = 0.14;
        const LEAD2_MELODY = [
            659, 0, 880, 783, 659, 587, 523, 0,
            587, 0, 698, 659, 587, 523, 493, 0,
            523, 0, 659, 587, 523, 440, 392, 0,
            440, 523, 587, 659, 587, 523, 493, 440,
        ];
        const LEAD2_BASS = [110, 87.31, 130.81, 98];
        const TRACKS = {
            chip: {
                step: CHIP_STEP,
                length: 64,
                play(i, t) {
                    const ev = chipEvents[i];
                    if (ev) {
                        const dur = ev.n * CHIP_STEP * 0.9;
                        playTone(ev.f, dur, "sawtooth", 0.02, null, t);
                        playTone(ev.f * 0.8, dur, "square", 0.012, null, t);
                    }
                    const root = CHIP_BASS[i >> 3];
                    if (i % 2 === 0) playTone(root, 0.09, "sawtooth", 0.045, null, t);
                    else playTone(root * 2, 0.07, "square", 0.02, null, t);
                    if (i % 4 === 2) playTone(180, 0.06, "square", 0.04, 60, t);
                },
            },
            techno: {
                step: 0.117,
                length: 16,
                play(i, t) {
                    if (i % 4 === 0) playTone(120, 0.14, "sine", 0.2, 40, t);
                    if (i % 4 === 2) playTone(8000, 0.03, "triangle", 0.02, null, t);
                    const bass = [55, 0, 55, 0, 55, 0, 73, 0, 55, 0, 55, 0, 49, 0, 65, 0];
                    if (bass[i]) playTone(bass[i], 0.1, "sawtooth", 0.035, null, t);
                    const stab = [880, 0, 0, 0, 0, 0, 1047, 0, 0, 0, 0, 0, 880, 0, 0, 0];
                    if (stab[i]) playTone(stab[i], 0.08, "square", 0.02, null, t);
                },
            },
            lead2: {
                step: LEAD2_STEP,
                length: 32,
                play(i, t) {
                    const note = LEAD2_MELODY[i];
                    if (note) {
                        playTone(note, LEAD2_STEP * 0.85, "triangle", 0.05, null, t);
                        playTone(note * 1.2, LEAD2_STEP * 0.85, "square", 0.012, null, t);
                    }
                    const root = LEAD2_BASS[(i >> 3) & 3];
                    if (i % 2 === 0) playTone(root, 0.11, "sawtooth", 0.035, null, t);
                    else playTone(root * 2, 0.06, "sine", 0.03, null, t);
                    if (i % 4 === 2) playTone(220, 0.05, "square", 0.03, 90, t);
                },
            },
        };
        let musicTrack = "chip";
        let musicTimer = null;
        let musicStep = 0;
        let musicNext = 0;

        function setMusicTrack(name) {
            if (musicTrack === name) return;
            musicTrack = name;
            musicStep = 0;
        }

        function scheduleMusic() {
            const track = TRACKS[musicTrack];
            const horizon = audioCtx.currentTime + 0.3;
            while (musicNext < horizon) {
                const delay = Math.max(0, musicNext - audioCtx.currentTime);
                track.play(musicStep % track.length, delay);
                musicNext += track.step;
                musicStep++;
            }
        }

        function startMusic() {
            if (!audioCtx || musicTimer) return;
            musicTrack = "chip";
            musicStep = 0;
            musicNext = audioCtx.currentTime + 0.05;
            scheduleMusic();
            musicTimer = setInterval(scheduleMusic, 100);
        }

        function stopMusic() {
            clearInterval(musicTimer);
            musicTimer = null;
        }

        const wrap = x => (x + W) % W;
        const open = (x, y) => {
            if (y < 0 || y >= H) return false;
            return grid[y][wrap(x)] !== "#";
        };
        const playerSpeed = () => 1000 / Math.max(150, 230 - (level - 1) * 10);
        const isCenter = v => Math.abs(v - Math.round(v)) < 1e-6;
        const distAt = (map, x, y) => (y < 0 || y >= H ? -1 : map[y][wrap(x)]);

        function resetPositions(now) {
            px = PLAYER_START[0];
            py = PLAYER_START[1];
            pdx = 0;
            pdy = 0;
            wdx = 0;
            wdy = 0;
            const previous = ghosts || [];
            ghosts = GHOST_HOME.map(({ cage, slot, delay }, i) => {
                const old = previous[i];
                if (old && old.cage !== null) return old;
                return cagedGhost(cage, slot, now + delay);
            });
            freezeUntil = now + 2000;
        }

        function loadLevel(n) {
            const L = LEVELS[Math.min(n, LEVELS.length) - 1];
            ROWS = L.rows;
            W = ROWS[0].length;
            H = ROWS.length;
            POWER = L.power;
            PLAYER_START = L.start;
            CAGES = L.cages;
            GHOST_HOME = L.ghosts;
            LOOK = L.look;
            canvas.width = W * T;
            canvas.height = H * T;
            buildBackdrop();
        }

        function newLevel(now) {
            loadLevel(level);
            grid = ROWS.map(r => r.split(""));
            for (const [x, y] of POWER) grid[y][x] = "o";
            for (const cage of CAGES) for (const [x, y] of cage.cells) grid[y][x] = " ";
            powerRespawns = [];
            ghosts = [];
            smallDotsLeft = 0;
            for (const row of grid) {
                for (const c of row) if (c === ".") smallDotsLeft++;
            }
            resetPositions(now);
        }

        function updateHud() {
            scoreEl.textContent = "Score : " + score;
            livesEl.textContent = "♥".repeat(Math.max(lives, 0));
            levelEl.textContent = "Niveau " + level;
        }

        function showOverlay(html, button) {
            msgEl.innerHTML = html;
            startBtn.textContent = button;
            overlay.hidden = false;
        }

        function newGame(now) {
            unlockAudio();
            startMusic();
            score = 0;
            lives = 3;
            level = 1;
            ghosts = [];
            newLevel(now);
            state = "playing";
            overlay.hidden = true;
            updateHud();
        }

        function loseLife(now) {
            lives--;
            updateHud();
            if (lives <= 0) {
                state = "over";
                stopMusic();
                sfx.gameOver();
                showOverlay("Perdu ! Score final : " + score, "Rejouer");
            } else {
                sfx.death();
                resetPositions(now);
            }
        }

        function distanceMap(sx, sy) {
            const map = Array.from({ length: H }, () => Array(W).fill(-1));
            const queue = [[sx, sy]];
            map[sy][sx] = 0;
            for (let i = 0; i < queue.length; i++) {
                const [x, y] = queue[i];
                for (const [dx, dy] of DIRS) {
                    const nx = wrap(x + dx);
                    const ny = y + dy;
                    if (open(nx, ny) && map[ny][nx] < 0) {
                        map[ny][nx] = map[y][x] + 1;
                        queue.push([nx, ny]);
                    }
                }
            }
            return map;
        }

        function isCageCell(x, y) {
            return CAGES.some(c => c.cells.some(([cx, cy]) => cx === x && cy === y));
        }

        function cagedGhost(cage, slot, waitUntil) {
            const [x, y] = CAGES[cage].cells[slot];
            return { x, y, dx: 0, dy: 0, cage, slot, waitUntil };
        }

        function cageSpot() {
            for (let cage = 0; cage < CAGES.length; cage++) {
                const taken = ghosts.filter(g => g.cage === cage).map(g => g.slot);
                const slot = CAGES[cage].cells.findIndex((_, i) => !taken.includes(i));
                if (slot >= 0) return { cage, slot };
            }
            return null;
        }

        function releaseGhost(g) {
            const [x, y] = CAGES[g.cage].door;
            Object.assign(g, { x, y, dx: 0, dy: 0, cage: null });
        }

        function canStep(g, dx, dy) {
            const nx = wrap(g.x + dx);
            const ny = g.y + dy;
            return open(nx, ny) && !isCageCell(nx, ny);
        }

        function claimedCells(o) {
            const cx = Math.round(o.x);
            const cy = Math.round(o.y);
            const nx = o.dx > 0 ? Math.floor(o.x) + 1 : o.dx < 0 ? Math.ceil(o.x) - 1 : cx;
            const ny = o.dy > 0 ? Math.floor(o.y) + 1 : o.dy < 0 ? Math.ceil(o.y) - 1 : cy;
            return [[cx, cy], [nx, ny]];
        }

        function freeGhostAt(x, y, except) {
            return ghosts.some(o => o !== except && o.cage === null && claimedCells(o).some(([cx, cy]) => wrap(cx) === wrap(x) && cy === y));
        }

        function chooseGhost(g, scared, map) {
            const opts = DIRS.filter(([dx, dy]) => canStep(g, dx, dy) && !freeGhostAt(g.x + dx, g.y + dy, g));
            const forward = opts.filter(([dx, dy]) => !(dx === -g.dx && dy === -g.dy));
            const pool = forward.length ? forward : opts;
            if (!pool.length) {
                g.dx = 0;
                g.dy = 0;
                return;
            }
            const cost = ([dx, dy]) => {
                const d = distAt(map, g.x + dx, g.y + dy);
                return d < 0 ? 999 : d;
            };
            let best = pool[0];
            for (const o of pool) {
                if (scared ? cost(o) > cost(best) : cost(o) < cost(best)) best = o;
            }
            g.dx = best[0];
            g.dy = best[1];
        }

        function choosePlayer(p) {
            if ((wdx || wdy) && open(p.x + wdx, p.y + wdy)) {
                p.dx = wdx;
                p.dy = wdy;
            } else if (!open(p.x + p.dx, p.y + p.dy)) {
                p.dx = 0;
                p.dy = 0;
            }
        }

        function advance(e, budget, choose, onArrive) {
            while (budget > 1e-9) {
                if (isCenter(e.x) && isCenter(e.y)) {
                    e.x = Math.round(e.x);
                    e.y = Math.round(e.y);
                    choose(e);
                    if (!e.dx && !e.dy) return;
                }
                const horiz = e.dx !== 0;
                const p = horiz ? e.x : e.y;
                const d = horiz ? e.dx : e.dy;
                const target = d > 0
                    ? (isCenter(p) ? p + 1 : Math.ceil(p))
                    : (isCenter(p) ? p - 1 : Math.floor(p));
                const dist = Math.abs(target - p);
                const move = budget >= dist - 1e-6 ? dist : budget;
                budget -= move;
                if (move < dist) {
                    if (horiz) e.x = p + d * move;
                    else e.y = p + d * move;
                    return;
                }
                if (horiz) e.x = wrap(target);
                else e.y = target;
                onArrive(e);
            }
        }

        function eatCell(x, y, now) {
            const c = grid[y][x];
            if (c !== "." && c !== "o") return;
            chompAt = now;
            score += c === "o" ? 50 : 10;
            grid[y][x] = " ";
            if (c === "o") {
                powerUntil = now + 6000;
                powerRespawns.push({ x, y, at: now + 20000 });
                sfx.power();
            } else {
                smallDotsLeft--;
                sfx.chomp();
            }
        }

        function movePlayer(now, dt) {
            const p = { x: px, y: py, dx: pdx, dy: pdy };
            if (!(isCenter(p.x) && isCenter(p.y)) && wdx === -p.dx && wdy === -p.dy) {
                p.dx = wdx;
                p.dy = wdy;
            }
            advance(p, dt * playerSpeed(), choosePlayer, c => eatCell(c.x, c.y, now));
            px = p.x;
            py = p.y;
            pdx = p.dx;
            pdy = p.dy;
        }

        function checkCollisions(now) {
            for (const g of ghosts) {
                if (g.cage !== null) continue;
                const ddx = Math.abs(g.x - px);
                if (Math.hypot(Math.min(ddx, W - ddx), g.y - py) >= 0.6) continue;
                if (now < powerUntil) {
                    score += 200;
                    sfx.eatGhost();
                    const spot = cageSpot();
                    if (spot) Object.assign(g, cagedGhost(spot.cage, spot.slot, now + 20000));
                } else {
                    loseLife(now);
                    return;
                }
            }
        }

        function tick(now, dt) {
            setMusicTrack(now < powerUntil ? "techno" : level >= 2 ? "lead2" : "chip");
            for (let i = powerRespawns.length - 1; i >= 0; i--) {
                const r = powerRespawns[i];
                if (now < r.at) continue;
                powerRespawns.splice(i, 1);
                grid[r.y][r.x] = "o";
            }
            movePlayer(now, dt);
            if (now >= freezeUntil) {
                const scared = now < powerUntil;
                const map = distanceMap(wrap(Math.round(px)), Math.round(py));
                ghosts.forEach(g => {
                    if (g.cage !== null && now >= g.waitUntil) {
                        const [dx, dy] = CAGES[g.cage].door;
                        if (!freeGhostAt(dx, dy, g)) releaseGhost(g);
                    }
                    if (g.cage !== null) return;
                    advance(g, dt * playerSpeed() * (scared ? 0.5 : 0.85), e => chooseGhost(e, scared, map), () => {});
                });
            }
            checkCollisions(now);
            if (smallDotsLeft <= 0) {
                level++;
                newLevel(now);
                sfx.levelUp();
            }
            updateHud();
        }

        function update(now, dt) {
            const chunks = Math.max(1, Math.ceil(dt * 60));
            for (let i = 0; i < chunks && state === "playing"; i++) {
                tick(now, dt / chunks);
            }
        }

        function threatOf(now) {
            let best = null;
            for (const g of ghosts) {
                if (g.cage !== null) continue;
                let dx = g.x - px;
                if (dx > W / 2) dx -= W;
                else if (dx < -W / 2) dx += W;
                const dy = g.y - py;
                const d = Math.hypot(dx, dy);
                if (d < PANIC_DIST && (!best || d < best.d)) best = { d, dx, dy };
            }
            return best;
        }

        function hash(x, y, s) {
            let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 982451653)) | 0;
            h = Math.imul(h ^ (h >>> 13), 1274126177);
            return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
        }

        function isWallCell(x, y) {
            if (y < 0 || y >= H) return true;
            return ROWS[y][(x + W) % W] === "#";
        }

        function drawConcrete(b, x, y) {
            const ox = x * T;
            const oy = y * T;
            const tone = Math.round(hash(x, y, 1) * 12);
            b.fillStyle = `rgb(${38 + tone}, ${40 + tone}, ${48 + tone})`;
            b.fillRect(ox, oy, T, T);
            for (let i = 0; i < 12; i++) {
                b.fillStyle = hash(x, y, 10 + i) > 0.5 ? "rgba(255, 255, 255, 0.06)" : "rgba(0, 0, 0, 0.14)";
                b.fillRect(ox + hash(x, y, 30 + i) * (T - 1), oy + hash(x, y, 50 + i) * (T - 1), 1, 1);
            }
            if (hash(x, y, 70) < 0.4) {
                b.save();
                b.beginPath();
                b.rect(ox, oy, T, T);
                b.clip();
                b.lineWidth = 0.8;
                const traceCrack = dx => {
                    let px = ox + hash(x, y, 71) * T + dx;
                    let py = oy + hash(x, y, 72) * T;
                    let a = hash(x, y, 73) * Math.PI * 2;
                    b.beginPath();
                    b.moveTo(px, py);
                    for (let k = 0; k < 4; k++) {
                        a += (hash(x, y, 80 + k) - 0.5) * 1.4;
                        px += Math.cos(a) * 3;
                        py += Math.sin(a) * 3;
                        b.lineTo(px, py);
                    }
                    b.stroke();
                };
                b.strokeStyle = "rgba(0, 0, 0, 0.6)";
                traceCrack(0);
                b.strokeStyle = "rgba(255, 255, 255, 0.08)";
                traceCrack(1);
                b.restore();
            }
        }

        function drawBlockWall(b, x, y, BW, BH, mortar, tone, cut) {
            const ox = x * T;
            const oy = y * T;
            b.save();
            b.beginPath();
            b.rect(ox, oy, T, T);
            b.clip();
            b.fillStyle = mortar;
            b.fillRect(ox, oy, T, T);
            for (let r = Math.floor(oy / BH); r <= Math.floor((oy + T - 1) / BH); r++) {
                const off = (r & 1) * (BW / 2);
                for (let k = Math.floor((ox - off) / BW); k <= Math.floor((ox + T - 1 - off) / BW); k++) {
                    const bx = k * BW + off + 1;
                    const by = r * BH + 1;
                    b.fillStyle = tone(hash(k, r, 3));
                    b.fillRect(bx, by, BW - 2, BH - 2);
                    if (cut) {
                        b.fillStyle = "rgba(255, 255, 255, 0.12)";
                        b.fillRect(bx, by, BW - 2, 2);
                        b.fillStyle = "rgba(0, 0, 0, 0.25)";
                        b.fillRect(bx, by + BH - 4, BW - 2, 2);
                    }
                }
            }
            if (!isWallCell(x, y - 1)) {
                b.fillStyle = "rgba(255, 230, 200, 0.3)";
                b.fillRect(ox, oy, T, 3);
            }
            if (!isWallCell(x - 1, y)) {
                b.fillStyle = "rgba(255, 230, 200, 0.2)";
                b.fillRect(ox, oy, 3, T);
            }
            if (!isWallCell(x, y + 1)) {
                b.fillStyle = "rgba(0, 0, 0, 0.5)";
                b.fillRect(ox, oy + T - 4, T, 4);
            }
            if (!isWallCell(x + 1, y)) {
                b.fillStyle = "rgba(0, 0, 0, 0.5)";
                b.fillRect(ox + T - 4, oy, 4, T);
            }
            b.restore();
        }

        function drawBrickWall(b, x, y) {
            drawBlockWall(b, x, y, 20, 10, "#5a524c", v => `hsl(14, ${32 + v * 14}%, ${30 + v * 14}%)`, false);
        }

        function drawStoneWall(b, x, y) {
            drawBlockWall(b, x, y, 40, 20, "#1f2330", v => `hsl(215, ${8 + v * 6}%, ${40 + v * 12}%)`, true);
        }

        function drawTiles(b, x, y) {
            const ox = x * T;
            const oy = y * T;
            b.fillStyle = (x + y) % 2 ? "#232b3c" : "#2a3346";
            b.fillRect(ox, oy, T, T);
            b.fillStyle = "rgba(255, 255, 255, 0.05)";
            b.fillRect(ox, oy, T, 1);
            b.fillRect(ox, oy, 1, T);
            b.fillStyle = "rgba(0, 0, 0, 0.35)";
            b.fillRect(ox, oy + T - 1, T, 1);
            b.fillRect(ox + T - 1, oy, 1, T);
        }

        const WALL_DRAWERS = { brick: drawBrickWall, stone: drawStoneWall };
        const FLOOR_DRAWERS = { concrete: drawConcrete, tiles: drawTiles };

        function buildBackdrop() {
            backdrop = document.createElement("canvas");
            backdrop.width = W * T;
            backdrop.height = H * T;
            const b = backdrop.getContext("2d");
            const paintWall = WALL_DRAWERS[LOOK.wall];
            const paintFloor = FLOOR_DRAWERS[LOOK.floor];
            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    if (ROWS[y][x] === "#") paintWall(b, x, y);
                    else paintFloor(b, x, y);
                }
            }
        }

        function drawGhost(g, color, cx, cy, now, scared) {
            let fill = color;
            if (scared) {
                const ending = powerUntil - now < 1500 && Math.floor(now / 150) % 2 === 0;
                fill = ending ? "#f8fafc" : "#2563eb";
            }
            const r = T / 2 - 3;
            ctx.save();
            ctx.shadowColor = fill;
            ctx.shadowBlur = 14;
            ctx.fillStyle = fill;
            ctx.beginPath();
            ctx.arc(cx, cy - 2, r, Math.PI, 0);
            ctx.lineTo(cx + r, cy + r);
            const waves = 4;
            const seg = (2 * r) / waves;
            for (let k = 0; k < waves; k++) {
                const x = cx + r - seg * (k + 1);
                const depth = 2.5 + 1.5 * Math.sin(now / 150 + k * 1.7);
                ctx.quadraticCurveTo(x + seg / 2, cy + r + depth * 2, x, cy + r);
            }
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.restore();
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(cx - 4, cy - 4, 3, 0, Math.PI * 2);
            ctx.arc(cx + 4, cy - 4, 3, 0, Math.PI * 2);
            ctx.fill();
            if (!scared) {
                ctx.fillStyle = "#0f172a";
                ctx.beginPath();
                const lookX = g.dx * 1.5;
                const lookY = g.dy * 1.5;
                ctx.arc(cx - 4 + lookX, cy - 4 + lookY, 1.5, 0, Math.PI * 2);
                ctx.arc(cx + 4 + lookX, cy - 4 + lookY, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawCage(cage) {
            const xs = cage.cells.map(([x]) => x);
            const ys = cage.cells.map(([, y]) => y);
            const minX = Math.min(...xs);
            const maxX = Math.max(...xs);
            const minY = Math.min(...ys);
            const maxY = Math.max(...ys);
            const left = minX * T + 6;
            const right = (maxX + 1) * T - 6;
            const top = minY * T - 2;
            const bottom = (maxY + 1) * T + 2;
            const mx = (left + right) / 2;
            const my = (top + bottom) / 2;
            const [dx, dy] = cage.door;
            const side = (x1, y1, x2, y2, gap) => {
                if (!gap) {
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                } else if (y1 === y2) {
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(mx - 8, y1);
                    ctx.moveTo(mx + 8, y1);
                    ctx.lineTo(x2, y2);
                } else {
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x1, my - 8);
                    ctx.moveTo(x1, my + 8);
                    ctx.lineTo(x2, y2);
                }
            };
            ctx.save();
            ctx.strokeStyle = "#22d3ee";
            ctx.lineWidth = 2;
            ctx.shadowColor = "#22d3ee";
            ctx.shadowBlur = 10;
            ctx.beginPath();
            for (let i = 1; i <= 2; i++) {
                const x = left + ((right - left) * i) / 3;
                ctx.moveTo(x, top);
                ctx.lineTo(x, bottom);
            }
            side(left, top, right, top, dy < minY);
            side(left, bottom, right, bottom, dy > maxY);
            side(left, top, left, bottom, dx < minX);
            side(right, top, right, bottom, dx > maxX);
            ctx.stroke();
            ctx.restore();
        }

        function drawAngryBrows(cx, cy) {
            ctx.save();
            ctx.strokeStyle = "#0f172a";
            ctx.lineWidth = 2.5;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(cx - 8, cy - 11);
            ctx.lineTo(cx - 1, cy - 7);
            ctx.moveTo(cx + 8, cy - 11);
            ctx.lineTo(cx + 1, cy - 7);
            ctx.stroke();
            ctx.restore();
        }

        function draw(now) {
            ctx.drawImage(backdrop, 0, 0);

            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    const c = grid[y][x];
                    const cx = x * T + T / 2;
                    const cy = y * T + T / 2;
                    if (c === ".") {
                        ctx.fillStyle = "rgba(253, 224, 71, 0.22)";
                        ctx.beginPath();
                        ctx.arc(cx, cy, 7, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "#fef9c3";
                        ctx.beginPath();
                        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (c === "o") {
                        const pulse = Math.sin(now / 120) * 2;
                        ctx.fillStyle = "rgba(253, 224, 71, 0.25)";
                        ctx.beginPath();
                        ctx.arc(cx, cy, 16 + pulse, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = "#fef08a";
                        ctx.beginPath();
                        ctx.arc(cx, cy, 10 + pulse, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            const scared = now < powerUntil;
            ghosts.forEach((g, i) => {
                const caged = g.cage !== null;
                const phase = (Math.sin(now / 220 + i * 2) + 1) / 2;
                const gx = g.x * T + T / 2;
                const gy = (g.y + 0.5 + (caged ? (phase - 0.5) * 0.5 : 0)) * T;
                drawGhost(g, GHOST_COLORS[i], gx, gy, now, scared);
                if (caged) drawAngryBrows(gx, gy);
            });
            CAGES.forEach((cage, c) => {
                if (ghosts.some(g => g.cage === c)) drawCage(cage);
            });

            const threat = state === "playing" && now >= powerUntil ? threatOf(now) : null;
            const shake = threat ? Math.sin(now / 28) * 1.6 : 0;
            const pcx = px * T + T / 2 + shake;
            const pcy = py * T + T / 2;
            const r = T / 2 - 3;
            const powered = now < powerUntil;
            const facing = pdx || pdy ? Math.atan2(pdy, pdx) : 0;
            const mouth = Math.max(0.2, threat ? 0.5 : 0, Math.max(0, 1 - (now - chompAt) / 160) * 0.7);
            const wobble = powered ? Math.sin(now / 35) * 0.4 : 0;
            const playerColor = powered && Math.floor(now / 90) % 2 ? "#f0abfc" : "#2dd4bf";
            ctx.save();
            ctx.shadowColor = playerColor;
            ctx.shadowBlur = 16;
            ctx.fillStyle = playerColor;
            ctx.beginPath();
            ctx.arc(pcx, pcy, r, facing + mouth, facing + Math.PI * 2 - mouth);
            ctx.lineTo(pcx, pcy);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.restore();
            ctx.fillStyle = "#f8fafc";
            ctx.beginPath();
            for (const e of [facing - mouth, facing + mouth]) {
                ctx.moveTo(pcx + Math.cos(e - 0.12) * r, pcy + Math.sin(e - 0.12) * r);
                ctx.lineTo(pcx + Math.cos(e) * r * 0.7, pcy + Math.sin(e) * r * 0.7);
                ctx.lineTo(pcx + Math.cos(e + 0.12) * r, pcy + Math.sin(e + 0.12) * r);
                ctx.closePath();
            }
            ctx.fill();
            ctx.strokeStyle = "#0f766e";
            ctx.lineWidth = 2;
            ctx.lineCap = "round";
            ctx.beginPath();
            for (const dx of [-5, 0, 5]) {
                ctx.moveTo(pcx + dx * 0.6, pcy - r + 2);
                ctx.quadraticCurveTo(pcx + dx * 1.2, pcy - r - 3, pcx + dx * 1.5 + 1, pcy - r - 7);
            }
            ctx.stroke();
            const look = threat ? [threat.dx / threat.d, threat.dy / threat.d] : [pdx, pdy];
            const eyes = [-0.9, 0.9].map(side => {
                const a = -Math.PI / 2 + side + wobble;
                return [pcx + Math.cos(a) * 6, pcy + Math.sin(a) * 6];
            });
            ctx.fillStyle = "#f8fafc";
            ctx.beginPath();
            for (const [ex, ey] of eyes) {
                ctx.moveTo(ex + 4, ey);
                ctx.arc(ex, ey, 4, 0, Math.PI * 2);
            }
            ctx.fill();
            ctx.fillStyle = "#0f172a";
            ctx.beginPath();
            for (const [ex, ey] of eyes) {
                const px2 = ex + look[0] * 1.3;
                const py2 = ey + look[1] * 1.3;
                ctx.moveTo(px2 + 2, py2);
                ctx.arc(px2, py2, 2, 0, Math.PI * 2);
            }
            ctx.fill();
            if (threat) {
                ctx.fillStyle = "#7dd3fc";
                ctx.beginPath();
                ctx.moveTo(pcx + 14, pcy - 14);
                ctx.lineTo(pcx + 11.6, pcy - 8);
                ctx.arc(pcx + 14, pcy - 8, 2.4, Math.PI, 0, true);
                ctx.closePath();
                ctx.fill();
            }
        }

        function frame(now) {
            const dt = lastFrame ? Math.min(0.05, (now - lastFrame) / 1000) : 0;
            lastFrame = now;
            if (state === "playing") update(now, dt);
            draw(now);
            requestAnimationFrame(frame);
        }

        window.addEventListener("keydown", e => {
            if (e.key === "m" || e.key === "M") {
                muted = !muted;
                return;
            }
            const k = KEYS[e.key];
            if (!k) return;
            e.preventDefault();
            wdx = k[0];
            wdy = k[1];
        });

        document.querySelectorAll(".pad button").forEach(b => {
            b.addEventListener("pointerdown", e => {
                e.preventDefault();
                wdx = Number(b.dataset.dx);
                wdy = Number(b.dataset.dy);
            });
        });

        let sx = 0;
        let sy = 0;
        canvas.addEventListener("touchstart", e => {
            sx = e.touches[0].clientX;
            sy = e.touches[0].clientY;
        }, { passive: true });
        canvas.addEventListener("touchmove", e => {
            e.preventDefault();
            const dx = e.touches[0].clientX - sx;
            const dy = e.touches[0].clientY - sy;
            if (Math.abs(dx) > 18 || Math.abs(dy) > 18) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    wdx = Math.sign(dx);
                    wdy = 0;
                } else {
                    wdx = 0;
                    wdy = Math.sign(dy);
                }
                sx = e.touches[0].clientX;
                sy = e.touches[0].clientY;
            }
        }, { passive: false });

        startBtn.addEventListener("click", () => newGame(performance.now()));

        newLevel(0);
        updateHud();
        showOverlay("Mange tous les points sans te faire attraper.<br>Flèches ou WASD pour bouger.", "Commencer");
        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
