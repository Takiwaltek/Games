<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chasse Pixels · Atelier de Takiwaltek</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #070b16;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        header {
            width: min(94vw, 600px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px 0 10px;
        }
        header a { color: #67e8f9; text-decoration: none; font-weight: 600; }
        h1 { margin: 0; font-size: 1.25rem; }
        .hud {
            width: min(94vw, 570px);
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .stage { position: relative; width: min(94vw, 570px); }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #000;
            border: 2px solid #1e293b;
            border-radius: 10px;
            touch-action: none;
        }
        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px;
            text-align: center;
            background: rgba(7, 11, 22, 0.8);
            border-radius: 10px;
        }
        .overlay[hidden] { display: none; }
        .overlay p { margin: 0; line-height: 1.5; }
        button {
            font: inherit;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(180deg, #22d3ee, #0e7490);
            border: 0;
            border-radius: 10px;
            padding: 12px 22px;
            cursor: pointer;
            box-shadow: 0 5px 0 #155e75;
        }
        button:active { transform: translateY(3px); box-shadow: 0 2px 0 #155e75; }
        .pad {
            margin-top: 14px;
            display: grid;
            grid-template-columns: repeat(3, 64px);
            grid-template-rows: repeat(2, 56px);
            gap: 8px;
        }
        .pad button {
            padding: 0;
            font-size: 1.4rem;
            background: #1e293b;
            box-shadow: 0 5px 0 #0f172a;
            user-select: none;
        }
        .pad .up { grid-column: 2; grid-row: 1; }
        .pad .left { grid-column: 1; grid-row: 2; }
        .pad .down { grid-column: 2; grid-row: 2; }
        .pad .right { grid-column: 3; grid-row: 2; }
        @media (hover: hover) and (pointer: fine) {
            .pad { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <a href="../../index.html">← Accueil</a>
        <h1>Chasse Pixels</h1>
    </header>

    <div class="hud">
        <span id="score">Score : 0</span>
        <span id="lives">♥♥♥</span>
        <span id="level">Niveau 1</span>
    </div>

    <div class="stage">
        <canvas id="game" width="570" height="450" aria-label="Jeu Chasse Pixels"></canvas>
        <div class="overlay" id="overlay">
            <p id="msg">Mange tous les points sans te faire attraper.<br>Flèches ou WASD pour bouger.</p>
            <button id="start" type="button">Commencer</button>
        </div>
    </div>

    <div class="pad" aria-hidden="true">
        <button class="up" data-dx="0" data-dy="-1" type="button">▲</button>
        <button class="left" data-dx="-1" data-dy="0" type="button">◀</button>
        <button class="down" data-dx="0" data-dy="1" type="button">▼</button>
        <button class="right" data-dx="1" data-dy="0" type="button">▶</button>
    </div>

    <script>
    (() => {
        const T = 30;
        const W = 19;
        const H = 15;
        const TOP = [
            ".......#.#.......",
            ".#####.#.#.#####.",
            "...#.........#...",
            "#.#.###.#.###.#.#",
            "....#.......#....",
            "##.##.#####.##.##"
        ];
        const ROWS = [
            "#".repeat(W),
            ...TOP.map(r => "#" + r + "#"),
            ".".repeat(W),
            ...TOP.slice().reverse().map(r => "#" + r + "#"),
            "#".repeat(W)
        ];
        const POWER = [[1, 1], [17, 1], [1, 13], [17, 13]];
        const PLAYER_START = [9, 7];
        const GHOST_HOME = [[9, 1], [9, 13], [17, 7]];
        const GHOST_COLORS = ["#f472b6", "#fb923c", "#a3e635"];
        const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        const KEYS = {
            ArrowUp: [0, -1], w: [0, -1], W: [0, -1],
            ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
            ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0],
            ArrowRight: [1, 0], d: [1, 0], D: [1, 0]
        };

        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const livesEl = document.getElementById("lives");
        const levelEl = document.getElementById("level");
        const overlay = document.getElementById("overlay");
        const msgEl = document.getElementById("msg");
        const startBtn = document.getElementById("start");

        let grid, dotsLeft, px, py, pdx, pdy, wdx, wdy, ghosts;
        let score = 0, lives = 3, level = 1;
        let powerUntil = 0, freezeUntil = 0, nextStep = 0;
        let state = "idle";

        const wrap = x => (x + W) % W;
        const open = (x, y) => {
            if (y < 0 || y >= H) return false;
            return grid[y][wrap(x)] !== "#";
        };
        const dist = (ax, ay, bx, by) => {
            const dx = Math.abs(ax - bx);
            return Math.min(dx, W - dx) + Math.abs(ay - by);
        };
        const stepMs = () => Math.max(95, 150 - (level - 1) * 10);

        function resetPositions(now) {
            px = PLAYER_START[0];
            py = PLAYER_START[1];
            pdx = 0;
            pdy = 0;
            wdx = 0;
            wdy = 0;
            ghosts = GHOST_HOME.map(([x, y]) => ({ x, y, dx: 0, dy: 0, home: [x, y] }));
            freezeUntil = now + 2000;
        }

        function newLevel(now) {
            grid = ROWS.map(r => r.split(""));
            for (const [x, y] of POWER) grid[y][x] = "o";
            dotsLeft = 0;
            for (const row of grid) {
                for (const c of row) if (c === "." || c === "o") dotsLeft++;
            }
            resetPositions(now);
        }

        function updateHud() {
            scoreEl.textContent = "Score : " + score;
            livesEl.textContent = "♥".repeat(Math.max(lives, 0));
            levelEl.textContent = "Niveau " + level;
        }

        function showOverlay(html, button) {
            msgEl.innerHTML = html;
            startBtn.textContent = button;
            overlay.hidden = false;
        }

        function newGame(now) {
            score = 0;
            lives = 3;
            level = 1;
            newLevel(now);
            state = "playing";
            nextStep = now + stepMs();
            overlay.hidden = true;
            updateHud();
        }

        function loseLife(now) {
            lives--;
            updateHud();
            if (lives <= 0) {
                state = "over";
                showOverlay("Perdu ! Score final : " + score, "Rejouer");
            } else {
                resetPositions(now);
            }
        }

        function moveGhost(g, scared) {
            let opts = DIRS
                .filter(([dx, dy]) => open(g.x + dx, g.y + dy))
                .map(([dx, dy]) => ({ dx, dy }));
            const forward = opts.filter(o => !(o.dx === -g.dx && o.dy === -g.dy));
            if (forward.length) opts = forward;
            if (!opts.length) return;

            let pick;
            if (Math.random() < 0.25) {
                pick = opts[Math.floor(Math.random() * opts.length)];
            } else {
                const rank = o => dist(g.x + o.dx, g.y + o.dy, px, py) * (scared ? -1 : 1);
                pick = opts.reduce((best, o) => (rank(o) < rank(best) ? o : best));
            }
            g.x = wrap(g.x + pick.dx);
            g.y += pick.dy;
            g.dx = pick.dx;
            g.dy = pick.dy;
        }

        function update(now) {
            if ((wdx || wdy) && open(px + wdx, py + wdy)) {
                pdx = wdx;
                pdy = wdy;
            }
            if (open(px + pdx, py + pdy)) {
                px = wrap(px + pdx);
                py += pdy;
            }

            const c = grid[py][px];
            if (c === "." || c === "o") {
                score += c === "o" ? 50 : 10;
                dotsLeft--;
                grid[py][px] = " ";
                if (c === "o") powerUntil = now + 6000;
            }

            if (now >= freezeUntil) {
                const scared = now < powerUntil;
                for (const g of ghosts) moveGhost(g, scared);
            }

            for (const g of ghosts) {
                if (g.x === px && g.y === py) {
                    if (now < powerUntil) {
                        score += 200;
                        g.x = g.home[0];
                        g.y = g.home[1];
                        g.dx = 0;
                        g.dy = 0;
                    } else {
                        loseLife(now);
                        return;
                    }
                }
            }

            if (dotsLeft <= 0) {
                level++;
                newLevel(now);
            }
            updateHud();
        }

        function drawWall(x, y) {
            ctx.fillStyle = "#1e3a8a";
            ctx.fillRect(x * T + 1, y * T + 1, T - 2, T - 2);
            ctx.strokeStyle = "#60a5fa";
            ctx.lineWidth = 2;
            ctx.strokeRect(x * T + 6, y * T + 6, T - 12, T - 12);
        }

        function drawGhost(g, color, cx, cy, now, scared) {
            let fill = color;
            if (scared) {
                const ending = powerUntil - now < 1500 && Math.floor(now / 150) % 2 === 0;
                fill = ending ? "#e2e8f0" : "#1d4ed8";
            }
            const r = T / 2 - 3;
            ctx.fillStyle = fill;
            ctx.beginPath();
            ctx.arc(cx, cy - 2, r, Math.PI, 0);
            ctx.lineTo(cx + r, cy + r);
            ctx.lineTo(cx - r, cy + r);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(cx - 4, cy - 4, 3, 0, Math.PI * 2);
            ctx.arc(cx + 4, cy - 4, 3, 0, Math.PI * 2);
            ctx.fill();
            if (!scared) {
                ctx.fillStyle = "#0f172a";
                ctx.beginPath();
                ctx.arc(cx - 3 + g.dx, cy - 4 + g.dy, 1.5, 0, Math.PI * 2);
                ctx.arc(cx + 5 + g.dx, cy - 4 + g.dy, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function draw(now) {
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let y = 0; y < H; y++) {
                for (let x = 0; x < W; x++) {
                    const c = grid[y][x];
                    const cx = x * T + T / 2;
                    const cy = y * T + T / 2;
                    if (c === "#") {
                        drawWall(x, y);
                    } else if (c === ".") {
                        ctx.fillStyle = "#fde68a";
                        ctx.beginPath();
                        ctx.arc(cx, cy, 3, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (c === "o") {
                        ctx.fillStyle = "#fef3c7";
                        ctx.beginPath();
                        ctx.arc(cx, cy, 7 + Math.sin(now / 120) * 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }

            const scared = now < powerUntil;
            ghosts.forEach((g, i) => {
                drawGhost(g, GHOST_COLORS[i], g.x * T + T / 2, g.y * T + T / 2, now, scared);
            });

            const pcx = px * T + T / 2;
            const pcy = py * T + T / 2;
            ctx.fillStyle = "#2dd4bf";
            ctx.beginPath();
            ctx.arc(pcx, pcy, T / 2 - 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#042f2e";
            ctx.beginPath();
            ctx.arc(pcx - 4 + pdx * 2, pcy - 3 + pdy * 2, 2.5, 0, Math.PI * 2);
            ctx.arc(pcx + 4 + pdx * 2, pcy - 3 + pdy * 2, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }

        function frame(now) {
            if (state === "playing" && now >= nextStep) {
                nextStep = now + stepMs();
                update(now);
                if (state !== "playing") nextStep = Infinity;
            }
            draw(now);
            requestAnimationFrame(frame);
        }

        window.addEventListener("keydown", e => {
            const k = KEYS[e.key];
            if (!k) return;
            e.preventDefault();
            wdx = k[0];
            wdy = k[1];
        });

        document.querySelectorAll(".pad button").forEach(b => {
            b.addEventListener("pointerdown", e => {
                e.preventDefault();
                wdx = Number(b.dataset.dx);
                wdy = Number(b.dataset.dy);
            });
        });

        let sx = 0;
        let sy = 0;
        canvas.addEventListener("touchstart", e => {
            sx = e.touches[0].clientX;
            sy = e.touches[0].clientY;
        }, { passive: true });
        canvas.addEventListener("touchmove", e => {
            e.preventDefault();
            const dx = e.touches[0].clientX - sx;
            const dy = e.touches[0].clientY - sy;
            if (Math.abs(dx) > 18 || Math.abs(dy) > 18) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    wdx = Math.sign(dx);
                    wdy = 0;
                } else {
                    wdx = 0;
                    wdy = Math.sign(dy);
                }
                sx = e.touches[0].clientX;
                sy = e.touches[0].clientY;
            }
        }, { passive: false });

        startBtn.addEventListener("click", () => newGame(performance.now()));

        newLevel(0);
        updateHud();
        showOverlay("Mange tous les points sans te faire attraper.<br>Flèches ou WASD pour bouger.", "Commencer");
        requestAnimationFrame(frame);
    })();
    </script>
</body>
</html>
